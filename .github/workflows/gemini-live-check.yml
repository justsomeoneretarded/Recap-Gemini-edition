name: Gemini Live Check

# Optional real-API integration tests. Runs only when started by hand and only
# with the GEMINI_API_KEY secret; ordinary CI never calls Gemini.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: python -m pip install -e '.[test,gemini]'
      - name: Run live Gemini checks (a few requests; free tier is fine)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_GEMINI_LIVE: '1'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret is not set"; exit 1; fi
          python -m pytest tests/test_gemini_live.py -v -s
